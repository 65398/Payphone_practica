<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Moda – Demo Payphone</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Cajita de Pagos Payphone (CSS + SDK) -->
  <link rel="stylesheet"
        href="https://cdn.payphonetodoesposible.com/box/v1.1/payphone-payment-box.css" />
  <script type="module"
          src="https://cdn.payphonetodoesposible.com/box/v1.1/payphone-payment-box.js"></script>
</head>
<body>
  <header>
    <h1>Tienda de moda</h1>
  </header>

  
  <main>
    <!-- Lista dinámica de productos -->
    <div id="product-list" class="product-container"></div>

 <!-- Lista dinámica de productos agregados al carrito -->
    <h2>🛒 Carrito de compra</h2>
    <ul id="cart" class="cart-list"></ul>

    <!-- Total a pagar -->
    <h3>Total: $<span id="total">0.00</span></h3>

    <!-- Acciones del carrito -->
<div style="margin-top: 15px; display: flex; gap: 10px;">
  <button id="payBtn">💳 Pagar con PayPhone</button>
  <button id="clearBtn">🗑 Vaciar carrito</button>
</div>


    <!-- Aquí Payphone inyectará su botón -->
    <div id="pp-button"></div>
  </main>

  <!-- Lógica del catálogo + integración Payphone -->
  <script type="module" src="script.js"></script>
</body>
</html>
