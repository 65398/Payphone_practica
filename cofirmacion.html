<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pago Confirmado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="confirm-container">
    <div class="confirm-card">
      <div class="confirm-icon">✓</div>
      <h1>¡Pago Confirmado!</h1>
      <p class="confirm-subtitle">Gracias por tu compra</p>

      <div class="confirm-details">
        <p><strong>Estado del pago:</strong> <span id="estado"></span></p>
        <p><strong>ID Cliente:</strong> <span id="clientTx"></span></p>
        <p><strong>ID PayPhone:</strong> <span id="payphoneTx"></span></p>
        <p><strong>Total pagado:</strong> $<span id="totalPago"></span></p>
      </div>

      <button onclick="volver()">Volver a la tienda</button>
    </div>
  </div>

  <script>
    // Recuperar datos guardados desde script.js
    const data = JSON.parse(localStorage.getItem("pagoConfirmado"));

    if (data) {
      document.getElementById("estado").textContent = data.estado || "Desconocido";
      document.getElementById("clientTx").textContent = data.clientTransactionId || "No disponible";
      document.getElementById("payphoneTx").textContent = data.payphoneId || "No disponible";
      document.getElementById("totalPago").textContent = data.total || "0.00";
    } else {
      document.getElementById("estado").textContent = "No disponible";
    }

    function volver() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
